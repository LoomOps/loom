  const internal = progress ? panel(&#x27;Internal steps&#x27;, &#x27;&lt;p&gt;실행기가 보고한 진행 상태입니다. Job 완료와 결과 검증은 별도로 확인합니다.&lt;/p&gt;&#x27;
    +(progress.status===&#x27;unavailable&#x27;?&#x27;&lt;p&gt;&#x27;+esc(progress.reason)+&#x27;&lt;/p&gt;&#x27;:&#x27;&#x27;)

function loomRequestDetail(descriptor) {
  const key = JSON.stringify(descriptor.key);
  if (loomEntityReads.get(descriptor.identity)?.key === key) return;
  if (loomEntityReads.size &gt;= 12) {
    const first = loomEntityReads.keys().next().value;
    loomEntityReads.delete(first);
    loomLocationPages.delete(first);
  }
  const requestId = ++loomDetailSequence;
  loomEntityReads.set(descriptor.identity, {key, requestId, kind:descriptor.kind});
  parent.postMessage({type:&#x27;loom-detail-request&#x27;, kind:descriptor.kind, identity:descriptor.identity, requestId}, &#x27;*&#x27;);
}

// Modality labels are structured types. Producer value strings describe timing,

function loomDatasetInputs(entity) {
  const d=entity.dataset_overview||{}, metadata=entity.metadata||entity.properties||{};
  const labels={rgb:&#x27;RGB&#x27;,rgbd:&#x27;RGB-D&#x27;,depth:&#x27;Depth&#x27;,state:&#x27;State&#x27;,action:&#x27;Action&#x27;,instruction:&#x27;Instruction&#x27;,vision:&#x27;Vision&#x27;};
  const compact=value=&gt;{const text=String(value).trim();const name=text.match(/^(RGB(?:-D)?|Depth)(?:\s*\([^)]*\))?$/i)?.[1]||text;return labels[name.toLowerCase()]||({&#x27;rgb-d&#x27;:&#x27;RGB-D&#x27;}[name.toLowerCase()]);};
  if (Array.isArray(d.inputs) &amp;&amp; d.inputs.length) {
    const names=d.inputs.filter(x=&gt;x.status===&#x27;present&#x27;).flatMap(x=&gt;{
      if (x.kind===&#x27;vision&#x27;) {
        const known=(Array.isArray(x.value)?x.value:[x.value]).flatMap(v=&gt;String(v).split(&#x27;·&#x27;)).map(compact).filter(Boolean);
        return known.length?known:[&#x27;Vision&#x27;];
      }
      return [labels[x.kind]||&#x27;Other&#x27;];
    });
    return [...new Set(names)].join(&#x27; · &#x27;) || (d.inputs.every(x=&gt;x.status===&#x27;absent&#x27;)?&#x27;해당 없음&#x27;:&#x27;미기록&#x27;);
  }
  const values=metadata.modalities||metadata.modality||[];
  return [...new Set((Array.isArray(values)?values:[values]).map(compact).filter(Boolean))].join(&#x27; · &#x27;)||&#x27;미기록&#x27;;
}

// Preserve numeric tokens exactly (JSON.stringify would round large integer IDs).
function loomPrettyJSON(source) {
  JSON.parse(source);
  let quoted=false, escaped=false, depth=0, result=&#x27;&#x27;;
  const newline=()=&gt; &#x27;\n&#x27;+&#x27;  &#x27;.repeat(Math.min(depth,32));
  for (const char of source) {
    if (quoted) {
      result+=char;
      if (escaped) escaped=false;
      else if (char===&#x27;\\&#x27;) escaped=true;
      else if (char===&#x27;&quot;&#x27;) quoted=false;
    } else if (char===&#x27;&quot;&#x27;) { quoted=true; result+=char; }
    else if (char===&#x27;{&#x27; || char===&#x27;[&#x27;) { depth++; result+=char+newline(); }
    else if (char===&#x27;}&#x27; || char===&#x27;]&#x27;) { depth--; result+=newline()+char; }

    else if (char===&#x27;:&#x27;) result+=&#x27;: &#x27;;

function loomInlineText(element, text) {

    const token=match[0]; let node;
    if (token[0]===&#x27;`&#x27;) {node=document.createElement(&#x27;code&#x27;);node.textContent=token.slice(1,-1);}
    else if (token.startsWith(&#x27;**&#x27;)) {node=document.createElement(&#x27;strong&#x27;);node.textContent=token.slice(2,-2);}

function loomRebuildExplorer() {

  const roots=new Set(Array.isArray(observed)?observed.map(item=&gt;item.path).filter(path=&gt;/^data\/[^/]+$/.test(path)):[]);
  const files=catalogData.entities.flatMap(entity=&gt;(entity.loom_files||[]).map(file=&gt;({file,entity})));
  // The catalog indexes registered files, not the host&#x27;s arbitrary filesystem.
  if(!Array.isArray(observed))for(const {file} of files){
    const match=/^data\/([^/]+)\//.exec(file.path||&#x27;&#x27;);if(match)roots.add(&#x27;data/&#x27;+match[1]);
  }

  for(const {file,entity} of files) {

    if(!mount)continue;

    if(parts.some(part=&gt;part===&#x27;.&#x27;||part===&#x27;..&#x27;))continue;
    let parent=&#x27;storage/&#x27;+mount;
    for(let i=0;i&lt;parts.length;i++) {
      const id=&#x27;storage/&#x27;+mount+&#x27;/&#x27;+parts.slice(0,i+1).join(&#x27;/&#x27;);
      let node=nodes.get(id);

&lt;/style&gt;&lt;style id=&quot;pa-operations-desk&quot;&gt;/* Operations desk palette on the original workspace&#x27;s existing surfaces. */
#pai-studio {
  --pa-bg: light-dark(#f3f5f9, #191d21);
  --pa-paper: light-dark(#fff, #23292f);
  --pa-side: light-dark(#f7f8fb, #20262c);
  --pa-ink: light-dark(#17243c, #e4e9ee);
  --pa-muted: light-dark(#526078, #abb3bb);
  --pa-line: light-dark(#dce2ed, #404a54);
  --pa-accent: light-dark(#284aa6, #a5b5c7);
  --pa-tint: light-dark(#e8eeff, #303d49);
  --pa-selected: light-dark(#e8eeff, #3c4a58);
  --pa-selected-text: light-dark(#284aa6, #e0e8f0);
  --pa-blue: light-dark(#254fa8, #9fb4cb);
  --pa-radius: 11px;
}

#pai-studio .pa-top {
  background: var(--pa-paper);
}

#pai-studio .pa-panel,
#pai-studio .pa-resources {
  box-shadow: 0 1px 2px light-dark(rgb(23 36 60 / 5%), rgb(0 0 0 / 16%));
}

#pai-studio h1 {
  font-weight: 680;
}

#pai-studio .pa-panel-head h2 {
  font-weight: 650;
}

#pai-studio .pa-eyebrow {
  font-weight: 650;
  letter-spacing: .08em;
}

#pai-studio .pa-job-status {
  border-color: color-mix(in srgb, currentColor 26%, transparent);
  border-radius: 6px;
}

/* Match the selected Operations desk brand and surface hierarchy. */
#pai-studio .pa-brand { gap: 10px; align-items: center; color: var(--pa-accent); font-size: 21px; letter-spacing: -.045em; font-weight: 400; padding: 22px 10px 24px; }
#pai-studio .pa-brand .pa-mark { display: flex; width: 33px; height: 33px; flex: none; }

  --pa-tint: color-mix(in srgb,var(--loom-brand-accent) 12%,var(--pa-side));

#pai-studio .pa-resource-meter &gt; i { background: var(--pa-accent); }

#pai-studio .pa-node-summary strong { display: block; font-size: 12px; font-weight: 600; color: var(--pa-ink); margin: 7px 0; }

/* Brand animation is decorative, never a live Job/status indicator. */
:root{--loom-brand-accent:light-dark(#436fc7,#9bb9f1)}

.wordmark svg.loom-logo,#pai-studio .pa-brand .pa-mark svg.loom-logo{fill:none;stroke:none}
.loom-logo .loom-logo-base,#pai-studio .pa-brand .pa-mark .loom-logo .loom-logo-base{fill:light-dark(#424548,#e1e3e6);stroke:none}
.loom-logo .loom-logo-gate,.loom-logo .loom-logo-token,#pai-studio .pa-brand .pa-mark .loom-logo .loom-logo-gate,#pai-studio .pa-brand .pa-mark .loom-logo .loom-logo-token{fill:var(--loom-logo-blue);stroke:none;transform-box:view-box}
.loom-logo-gate{animation:loom-gate 8s ease-in-out infinite both}
.loom-logo-token{animation:loom-token-move 8s ease-in-out infinite both,loom-token-fade 8s ease-in-out infinite both}

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  const isShare = document.documentElement.classList.contains(
    "visualization-share-root",
  );
  let viewportHeight = globalThis.innerHeight;
  let sizeFingerprint = null;
  let sizeWriteTimeout;
  let lastSize = null;
  let pendingSize = null;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const sizeStorageKey = `${storageKey}:share-size-v1`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  // Only appearance is durable. Workspace, selections and comparison state
  // belong to this loaded document, never to another tab or a reload.
  const preferencesOnly = (value) => {
    const theme = value?.privateContent?.workspaceV3?.theme ?? value?.privateContent?.themePreference;
    return {modelContent:null, privateContent:['light','dark','system'].includes(theme)?{themePreference:theme}:null};
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = preferencesOnly(parseState(savedState));
        storage.setItem(storageKey, JSON.stringify(state));
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = preferencesOnly(parseState(data.state));
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>

















































<script>// Parent owns sharing; the sandbox receives no clipboard or credential access.
function paiShowShare(url){
 document.querySelector('#pai-share-dialog')?.close();
 const dialog=document.createElement('dialog');dialog.id='pai-share-dialog';
 dialog.setAttribute('aria-labelledby','pai-share-title');
 dialog.style.cssText='color-scheme:light dark;color:light-dark(#222,#eee);background:light-dark(#fff,#242424);border:1px solid #8886;border-radius:16px;padding:24px;width:min(420px,calc(100vw - 64px));box-shadow:0 20px 80px #0004;font:14px system-ui';
 dialog.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px"><h2 id="pai-share-title" style="margin:0;font-size:20px">Share</h2><button type="button" data-share-close aria-label="공유 창 닫기" style="border:0;background:none;color:inherit;font-size:24px;cursor:pointer">×</button></div><p style="line-height:1.6;opacity:.7">이 페이지의 링크를 공유합니다. 기존 접근 권한은 유지됩니다.</p><label for="pai-share-url">링크</label><input id="pai-share-url" readonly style="box-sizing:border-box;width:100%;padding:12px;margin:8px 0 16px;border:1px solid #8886;border-radius:8px;background:transparent;color:inherit"><div style="display:flex;gap:12px;align-items:center"><button type="button" data-share-copy style="padding:10px 18px;border:0;border-radius:24px;background:light-dark(#222,#eee);color:light-dark(#fff,#222);font:inherit;cursor:pointer">Copy link</button><a data-share-open target="_blank" rel="noopener noreferrer" style="color:inherit">새 창에서 열기</a></div><p data-share-status role="status" style="margin-bottom:0;min-height:20px"></p>';
 const input=dialog.querySelector('input'),copy=dialog.querySelector('[data-share-copy]'),status=dialog.querySelector('[data-share-status]');
 input.value=url;dialog.querySelector('[data-share-open]').href=url;
 dialog.querySelector('[data-share-close]').onclick=()=>dialog.close();
 dialog.addEventListener('close',()=>{dialog.remove();document.querySelector('iframe')?.focus();},{once:true});
 copy.onclick=()=>{
  input.focus();input.select();let ok=false;try{ok=document.execCommand('copy');}catch{}
  status.textContent=ok?'링크를 복사했습니다.':'선택된 링크를 ⌘/Ctrl+C로 복사하세요.';

 };
 document.body.append(dialog);dialog.showModal();copy.focus();

// Pure bounded route codec, shared by parent and opaque document. No filesystem URLs.
const paiRouteViews={dashboard:'queue',explorer:'files',models:'models',datasets:'datasets',experiments:'experiments',comparison:'comparison',issues:'issues',agent:'agent'};
function paiParseRoute(hash){
 if(typeof hash!=='string'||hash.length>1800)return null;
 const [path,query='']=hash.replace(/^#/,'').split('?');const bits=path.split('/');
 try{
  const params=new URLSearchParams(query);if([...params.keys()].some(k=>!['attempt','artifact','disposition'].includes(k)))return null;
  if(bits.length!==3||!['entities','views'].includes(bits[1]))return null;
  const id=decodeURIComponent(bits[2]);if(!/^[A-Za-z0-9_.:-]{1,160}$/.test(id))return null;
  for(const k of ['attempt','artifact'])if(params.has(k)&&!/^[A-Za-z0-9_.:-]{1,160}$/.test(params.get(k)))return null;
  if(bits[1]==='views'&&!paiRouteViews[id])return null;
  if(params.has('disposition')&&params.get('disposition')!=='discarded')return null;
  return {type:bits[1],id,attempt:params.get('attempt'),artifact:params.get('artifact'),disposition:params.get('disposition')};
 }catch{return null;}
}
function paiRouteHash(r){
 const q=new URLSearchParams();for(const k of ['attempt','artifact','disposition'])if(r[k])q.set(k,r[k]);
 return '#/'+r.type+'/'+encodeURIComponent(r.id)+(q.size?'?'+q:'');
}
function paiViewRoute(v){
 const id=v.routeOwner||v.entity||v.model||v.agentDocId;
 if(id)return {type:'entities',id,attempt:v.routeAttempt||null,artifact:v.routeArtifact||null};
 return {type:'views',id:Object.keys(paiRouteViews).find(k=>paiRouteViews[k]===v.page)||'dashboard',disposition:v.resultDispositionFilter==='discarded'?'discarded':null};
}

// Shared preference for the trusted Dashboard parent and entry page.
(() => {
  const valid = value => ['light','dark','system'].includes(value);
  function read() {
    const value = document.cookie.split(';').map(v=>v.trim()).find(v=>v.startsWith('loom_theme='))?.slice(11);
    return valid(value)?value:'system';
  }
  function apply(mode=read()) {
    if(!valid(mode)) mode='system';
    document.documentElement.style.colorScheme=mode==='system'?'light dark':mode;
    document.documentElement.dataset.loomTheme=mode;
    document.querySelectorAll('[data-loom-theme]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.loomTheme===mode)));
    window.dispatchEvent(new CustomEvent('loom-theme-updated',{detail:mode}));
    return mode;
  }
  function set(mode) {
    if(!valid(mode)) return;
    document.cookie=`loom_theme=${mode}; Path=/; Max-Age=31536000; SameSite=Lax${location.protocol==='https:'?'; Secure':''}`;
    apply(mode);
  }
  window.LoomTheme={read,apply,set};
  apply();
  addEventListener('pageshow',()=>apply());
  addEventListener('focus',()=>apply());
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)apply();});
  document.addEventListener('click',event=>{const control=event.target.closest('[data-loom-theme]');if(control)set(control.dataset.loomTheme);});
})();

let loomPresentationView='research';
// Adapt scoped Ops records to the original workspace's presentation fields.
function loomHost(host) {
  return typeof host === 'string' ? {name:host, hostname:host} : host;
}

function loomCatalogProjection(catalog) {
  const work = new Map(catalog.entities
    .filter(entity => entity.loom_history?.source === 'queue' && entity.loom_history.kind === 'work')
    .map(entity => [entity.loom_history.id, entity]));
  const entities = catalog.entities.flatMap(entity => {
    if (entity.loom_history?.source === 'queue' && entity.loom_history.kind !== 'job_view') return [];
    if (entity.loom_registry) {
      const kind = entity.kind === 'experiment' ? 'run' : entity.kind;
      const properties = {...entity.properties};
      const metrics = (entity.metrics || []).map(metric => Array.isArray(metric.observations) ? metric : ({
        ...metric,
        id:metric.name,
        kind:'series',
        label:metric.name,
        aggregation:metric.denominator,
        x_label:'step',
        observations:(metric.series || []).map(point => ({x:point.step, value:point.value})),
      }));
      return [{...entity, kind, label:entity.label || entity.id, properties, metrics,
        loom_job_id:entity.loom_job?.id}];
    }
    if (entity.loom_job && entity.kind === 'job') {
      return [{...entity, label:entity.label || entity.id,
        properties:{...entity.properties, state:entity.state, created_at:entity.created}}];
    }
    const originalWork = entity.properties?.record_role === 'work'
      ? work.get(entity.properties.id) || work.get(entity.id.replace(/^work:/, '')) : null;
    const displayRecord = originalWork?.properties ? {...entity, ...originalWork} : entity;
    return [{...displayRecord, revision:entity.revision ?? entity.loom_history?.revision,
      ...(originalWork ? {loom_history:originalWork.loom_history} : {})}];
  });
  const selected=entities.filter(e=>loomPresentationView==='all'||(loomPresentationView==='builtin'?e.owner_kind==='built-in':loomPresentationView==='operations'?e.presentation?.scope==='operations':e.presentation?.visible!==false));
  return {...catalog,entities:selected,all_entities:entities,presentation_view:loomPresentationView,host:loomHost(catalog.host),
    sources:(catalog.sources || []).filter(source => source && typeof source === 'object')};
}

// The top-level document is the only transport and credential owner.
(() => {
  const frame = document.getElementById('codex-visualization');
  const access = document.getElementById('loom-entry');
  const status = document.getElementById('loom-access-status');
  let csrf = '';
  let ssoEnabled = false;
  let sessionUser = null;
  let tailnetInfo = null;
  let authenticated = false;
  const signedIn = () => authenticated;
  let lifetime = new AbortController();
  let catalogRequest;
  let resourceInterest = false;
  let resourceTimer;
  let resourceBusy = false;
  let catalogLoaded = false;
  let catalogEntities = new Map();
  let mediaRequest;
  let revisionTimer;
  let catalogRevision;
  let buildInfo;
  let entryURL = '';
  let updateTimer;
  let updatesBusy = false;
  const retry = document.getElementById('loom-entry-retry');
  retry.addEventListener('click',()=>location.reload());

  function showBuild(build) {
    buildInfo = build;
    if (build) emit('loom-build', {build});
    emit('loom-session', {user:sessionUser,tailnet:tailnetInfo});
    emit('loom-theme', {mode:window.LoomTheme.read()});
  }

  function emit(type, fields = {}) {
    frame.contentWindow?.postMessage({type, ...fields}, '*');
  }

  window.addEventListener('loom-theme-updated',event=>emit('loom-theme',{mode:event.detail}));

  function authError(error) {
    return error.status === 401 || error.invalidCredential;
  }

  function reset(message = '') {
    lifetime.abort();
    lifetime = new AbortController();
    clearTimeout(resourceTimer);
    clearTimeout(revisionTimer);
    clearTimeout(updateTimer);
    authenticated = false;
    sessionUser = null;
    emit('loom-session',{user:null});
    catalogEntities.clear();
    status.textContent = message;
    access.hidden = false;
    frame.hidden = true;
    if (entryURL) {location.replace(entryURL+'/');return;}
    document.getElementById('loom-sso-login').hidden = !ssoEnabled;
    retry.hidden = false;
  }

  async function get(path, signal = lifetime.signal) {
    const response = await fetch(path, {
      cache: 'no-store', credentials: 'same-origin', redirect: 'error',
      signal: AbortSignal.any([signal, AbortSignal.timeout(15000)]),
    });
    if (!response.ok) {
      const error = new Error('HTTP ' + response.status);
      error.status = response.status;
      if (response.status === 403) {
        const body = await response.json().catch(() => ({}));
        error.invalidCredential = ['Invalid token', 'Invalid or expired credential'].includes(body.error);
      }
      throw error;
    }
    return response;
  }

  async function read(path, signal) {
    return (await get(path, signal)).json();
  }

  let researchIncoming=null;
  window.addEventListener('message',event=>{
    if(event.source!==frame.contentWindow||event.data?.type!=='loom-research-view'||!['research','operations','builtin','all'].includes(event.data.view)||!researchIncoming)return;
    loomPresentationView=event.data.view;
    const catalog=loomCatalogProjection(researchIncoming);
    emit('pai-catalog-data',{catalog,connected:true});
  });
  async function refreshCatalog() {
    if (!signedIn() || catalogRequest) return;
    const signal = lifetime.signal;
    catalogRequest = read('/api/dashboard/catalog', signal);
    try {
      const incoming = await catalogRequest;
      if (signal.aborted) return;
      if (!Array.isArray(incoming.entities)) throw new Error('Invalid catalog response');
      catalogRevision = incoming.revision;
      researchIncoming=incoming;
      const catalog = loomCatalogProjection(incoming);
      catalogEntities = new Map((catalog.all_entities||catalog.entities).map(entity => [entity.id, entity]));
      emit('pai-catalog-data', {catalog, connected: true});
      window.dispatchEvent(new Event('pai-auth-restored'));
      catalogLoaded = true;
      frame.hidden = false;
      access.hidden = true;
    } catch (error) {
      if (signal.aborted) return;
      if (authError(error)) return reset('현재 credential로 다시 연결해 주세요.');
      if (error.status === 403) {

    const signal = lifetime.signal;
    let path;
    if (kind === 'history' && entity?.loom_history) {
      const {source, kind, id, revision} = entity.loom_history;

    } else if (kind === 'registry' && /^[a-zA-Z0-9][a-zA-Z0-9_.:-]{0,159}$/.test(entity?.loom_registry?.id || '')) {

  async function media({entity, id}, download = false) {
    if (!signedIn() || typeof entity !== 'string' || !/^[a-zA-Z0-9][a-zA-Z0-9_.:-]{0,159}$/.test(id || '')) return;
    const item = catalogEntities.get(entity)?.loom_media?.find(item => item.id === id);
    if (!item || item.status !== 'available') return;
    mediaRequest?.abort();
    mediaRequest = new AbortController();
    const signal = AbortSignal.any([mediaRequest.signal, lifetime.signal]);
    try {
      const response = await get('/api/dashboard/media/' + item.id, signal);
      const blob = await response.blob();
      if (blob.type !== item.mime || (!blob.size && !['text/markdown','text/plain','application/json','application/x-ndjson'].includes(item.mime))) throw new Error('Invalid media response');
      if (signal.aborted) return;
      if (!download) return emit('loom-media-response', {entity, id, label:item.label, blob});
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = (item.label || 'loom-media').replace(/[\\/\r\n]/g, '_');
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    } catch (error) {
      if (signal.aborted) return;
      if (authError(error)) return reset('현재 credential로 다시 연결해 주세요.');
      emit('loom-media-response', {entity, id, error:error.status || 503});
    }
  }
